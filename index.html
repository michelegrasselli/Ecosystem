<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="The creation of ELYRA — an explorable procedurally generated planet in a cartoon style." />
    <title>The creation of ELYRA</title>
    <!-- caratteri dei titoli dei video (regia); senza rete si ripiega su Georgia -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%233f7c74'/%3E%3Cpath d='M6 20c4-1 6-5 10-4s6 4 10 2' stroke='%23c9b07a' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- HUD -->
    <div id="hud" class="hud">
      <div class="hud-block" id="hud-readout">
        <div class="hud-row"><span class="hud-key">Lat</span><span class="hud-val" id="hud-lat">0.00°</span></div>
        <div class="hud-row"><span class="hud-key">Lon</span><span class="hud-val" id="hud-lon">0.00°</span></div>
        <div class="hud-row"><span class="hud-key">Elevation</span><span class="hud-val" id="hud-elev">—</span></div>
        <div class="hud-row"><span class="hud-key">Land</span><span class="hud-val" id="hud-nation">—</span></div>
        <div class="hud-row"><span class="hud-key">Biome</span><span class="hud-val" id="hud-biome">—</span></div>
        <div class="hud-row"><span class="hud-key">Temp</span><span class="hud-val" id="hud-temp">—</span></div>
        <div class="hud-row hud-cam"><span class="hud-key">Altitude</span><span class="hud-val" id="hud-alt">—</span></div>
      </div>

      <div class="hud-tools">
        <button class="tool" id="btn-zoom-in" title="Zoom in">+</button>
        <button class="tool" id="btn-zoom-out" title="Zoom out">−</button>
        <button class="tool" id="btn-home" title="Back to space">⌂</button>
      </div>

      <!-- Deliberately faint save button -->
      <button id="btn-save" class="save-ghost" title="Save the planet state (Ctrl+S)">save</button>
      <div id="toast" class="toast"></div>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading">
      <div class="loading-inner">
        <div class="loading-title">THE CREATION OF ELYRA</div>
        <div class="loading-sub" id="loading-step">initialising…</div>
        <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
      </div>
    </div>

    <!-- Aperto con doppio clic (file://) il sorgente non può partire: si passa
         alla build in dist/ (npm run build). Rimosso dalla build stessa. -->
    <script data-source-only>
      if (location.protocol === 'file:') {
        document.getElementById('loading-step').textContent = 'opening dist/index.html… (if nothing happens, run npm run build)'
        location.replace('dist/index.html')
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
